[workspace]
resolver = "2"
members  = [
    "ai_engine",
    "shell",
    "compositor",
    "config_engine",
    "bootloader",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT"
authors      = ["NexusOS Contributors"]
rust-version = "1.75"

[workspace.dependencies]
# ── Async ────────────────────────────────────────────────────────────────────
tokio        = { version = "1.36",  features = ["full"] }

# ── Error handling ────────────────────────────────────────────────────────────
anyhow       = "1.0"
thiserror    = "1.0"

# ── Logging ───────────────────────────────────────────────────────────────────
log          = "0.4"
env_logger   = "0.11"

# ── Serialization ─────────────────────────────────────────────────────────────
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"

# ── HTTP ──────────────────────────────────────────────────────────────────────
reqwest      = { version = "0.11", default-features = false,
                 features = ["json", "stream", "rustls-tls"] }

# ── Sync ──────────────────────────────────────────────────────────────────────
parking_lot  = "0.12"

# ── LRU cache ─────────────────────────────────────────────────────────────────
lru          = "0.12"

# ── Lua 5.4 ───────────────────────────────────────────────────────────────────
mlua         = { version = "0.9", features = ["lua54", "vendored"] }

# ── System dirs ───────────────────────────────────────────────────────────────
dirs         = "5.0"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev]
opt-level = 1
debug     = true
